<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- 强制浅色：小程序内嵌页面若跟随系统深色，白卡片上的标题会变成浅灰而"看不见" -->
  <meta name="color-scheme" content="light">
  <title>从手机文件夹选择</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <style>
    /* 背景固定纯白，且铺满整屏，避免 web-view 露出底色 */
    html, body { background:#ffffff; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0;
      min-height:100vh;
      box-sizing:border-box;
      padding:16px;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      color:#1f2329;
    }
    /* 内容层抬到背景之上：position + z-index，白卡不受任何底纹影响 */
    .wrap { position:relative; z-index:1; }
    .card {
      position:relative;
      z-index:1;
      background:#ffffff;
      border:1px solid #eceef1;
      border-radius:14px;
      padding:18px 16px;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
    }
    /* 与小程序「点击选择文件」对齐：30rpx / 600 字重（rpx→vw 等比，最大 20px） */
    h1 {
      margin:0 0 8px;
      /* 先给不支持 CSS min() 的老内核一个正常值，再被下一行覆盖 */
      font-size:17px;
      font-size:min(4vw, 20px);
      line-height:1.4;
      font-weight:600;
      color:#1f2329;
    }
    p { color:#6b7075; font-size:13px; line-height:1.7; margin:8px 0 0; }
    /* 选文件的按钮：把一个【透明但可点】的 file input 盖在按钮上。
       为什么不用 display:none + label：安卓微信内嵌网页（XWeb）里，
       点击 label 触发的 hidden input 有时不弹选择器，直接点 input 最稳。 */
    .pick-wrap { position:relative; margin-top:16px; height:52px; }
    .pick {
      position:absolute; left:0; right:0; top:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      background:#2b7aef; color:#ffffff; border-radius:12px;
      font-size:16px; font-weight:600; user-select:none;
    }
    .pick.disabled { opacity:.5; }
    .file-overlay {
      position:absolute; left:0; top:0; width:100%; height:100%;
      opacity:0; z-index:2; cursor:pointer; font-size:0;
      -webkit-appearance:none; appearance:none; border:0; padding:0; background:transparent;
    }
    .file-overlay.disabled { pointer-events:none; }
    #status { margin-top:14px; font-size:13px; color:#2b7aef; word-break:break-all; min-height:18px; }
    #status.err { color:#e54545; }
    .meta { margin-top:10px; font-size:12px; color:#8a9099; word-break:break-all; }
    .tip { margin-top:16px; padding:12px 14px; border-radius:10px; background:#eef4ff; color:#2b6ad0; font-size:12px; line-height:1.6; }
    .bar { margin-top:12px; height:4px; border-radius:999px; background:#eceef1; overflow:hidden; display:none; }
    .bar.on { display:block; }
    .bar span { display:block; height:100%; width:0; background:#2b7aef; transition:width .2s; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>从手机文件夹选择文件</h1>
      <p>点下方按钮选择手机里的文件，上传后会自动返回小程序进行转换。</p>

      <div class="pick-wrap">
        <div class="pick" id="pickBtn">选择手机文件</div>
        <input type="file" id="file" class="file-overlay" aria-label="选择手机文件">
      </div>

      <div id="status"></div>
      <div class="bar" id="bar"><span id="barIn"></span></div>
      <div class="meta" id="meta"></div>

      <div class="tip">
        支持文档 / 图像 / 音频 / 视频 / 电子书 / 压缩包；单个文件不超过 <b>10&nbsp;MB</b>。
        大文件会自动切成小片上传（云函数单次执行时间很短，切片才传得动），进度见上方。
        也可以直接回到小程序，用「从聊天记录选择」——把文件先发到任意聊天即可。
        <br>安卓端若在微信里选不中文件，请改用「从聊天记录选择」（安卓微信内嵌网页对选文件的限制更多）。
      </div>
    </div>
  </div>

  <script>
    // 上传地址优先从 URL 参数 upload 读取 —— 小程序会按 config/env.js 的
    // uploadFromWebUrl 注入，因此【本文件部署后不需要修改】。
    // 只有单独打开本页调试时，才需要填下面的兜底常量。
    var FALLBACK_UPLOAD_URL = "";
    function query(name) {
      var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
      return m ? decodeURIComponent(m[1]) : "";
    }
    var UPLOAD_URL = query("upload") || FALLBACK_UPLOAD_URL;

    var MAX_SIZE = 10 * 1024 * 1024;
    // 单片原始字节数。云函数执行超时可能只有 3 秒（改大要升套餐），
    // 512KB 一片时单次调用约 1 秒，3 秒也够；再大就容易被截断。
    var CHUNK = 512 * 1024;
    var busy = false;

    function el(id) { return document.getElementById(id); }
    function setStatus(s, isErr) {
      var n = el("status");
      n.textContent = s || "";
      n.className = isErr ? "err" : "";
    }
    function setMeta(s) { el("meta").textContent = s || ""; }
    function setBar(p) {
      var bar = el("bar");
      if (p == null) { bar.className = "bar"; el("barIn").style.width = "0"; return; }
      bar.className = "bar on";
      el("barIn").style.width = Math.max(0, Math.min(100, p)) + "%";
    }
    function human(bytes) {
      if (bytes == null) return "";
      var u = ["B", "KB", "MB", "GB"], n = bytes, i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (i === 0 || n >= 10 ? n.toFixed(0) : n.toFixed(1)) + u[i];
    }
    function setPickEnabled(on) {
      el("pickBtn").className = on ? "pick" : "pick disabled";
      el("file").className = on ? "file-overlay" : "file-overlay disabled";
      el("file").disabled = !on;
    }
    function reset() { busy = false; setPickEnabled(true); }
    function newId() {
      var s = "";
      var chars = "abcdef0123456789";
      for (var i = 0; i < 24; i++) s += chars.charAt(Math.floor(Math.random() * 16));
      return s;
    }
    function post(obj) {
      // text/plain 避免 CORS 预检
      return fetch(UPLOAD_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(obj)
      }).then(function (r) { return r.json(); });
    }
    // 读 Blob 为 base64（去掉 data URL 前缀）
    function readBase64(blob) {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onerror = function () { reject(new Error("读取文件失败")); };
        fr.onload = function () {
          var s = String(fr.result || "");
          var i = s.indexOf(",");
          resolve(i >= 0 ? s.slice(i + 1) : s);
        };
        fr.readAsDataURL(blob);
      });
    }
    function backToMiniApp(id, name, size) {
      wx.miniProgram.redirectTo({
        url: "/pages/convert/convert?webUploadId=" + encodeURIComponent(id)
           + "&name=" + encodeURIComponent(name)
           + "&size=" + (size || 0)
      });
    }
    function backWithFile(fileID, name, size) {
      wx.miniProgram.redirectTo({
        url: "/pages/convert/convert?fileID=" + encodeURIComponent(fileID)
           + "&name=" + encodeURIComponent(name)
           + "&size=" + (size || 0)
      });
    }

    if (!UPLOAD_URL) {
      setStatus(
        "尚未拿到上传地址：它应由小程序通过 ?upload=... 传入。" +
        "请在小程序 config/env.js 里填写 uploadFromWebUrl 后重新进入本页（见 h5/README.md）。",
        true
      );
      setPickEnabled(false);
    } else {
      el("file").addEventListener("change", function (e) {
        if (busy) return;
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        e.target.value = "";

        if (f.size > MAX_SIZE) {
          setStatus("文件过大（" + human(f.size) + "），上限 10 MB。请压缩后再试，或改用「从聊天记录选择」。", true);
          return;
        }
        if (!f.size) { setStatus("文件是空的，换一个吧。", true); return; }

        busy = true;
        setPickEnabled(false);
        setMeta(f.name + " · " + human(f.size));

        // 小文件走一次性上传（少一次往返）；大文件切片，绕开云函数 3 秒执行超时
        if (f.size <= CHUNK) return uploadOnce(f);
        return uploadChunked(f);
      });
    }

    function uploadOnce(f) {
      setStatus("读取中…");
      setBar(10);
      readBase64(f).then(function (b64) {
        setStatus("上传中…");
        setBar(45);
        return post({ name: f.name, dataBase64: b64 });
      }).then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || "未知错误");
        setBar(100);
        setStatus("上传成功，正在返回小程序…");
        backWithFile(res.fileID, res.name || f.name, res.size || f.size);
      }).catch(function (err) {
        reset();
        setBar(null);
        setStatus("上传失败：" + ((err && err.message) || err), true);
      });
    }

    function uploadChunked(f) {
      var uploadId = newId();
      var total = Math.ceil(f.size / CHUNK);
      var parts = [];
      var sent = 0;

      function step(i) {
        if (i >= total) return commit();
        var start = i * CHUNK;
        var end = Math.min(f.size, start + CHUNK);
        setStatus("正在上传第 " + (i + 1) + " / " + total + " 片…");
        setBar(Math.round((sent / f.size) * 90));
        // 单片失败重试一次：移动网络偶发抖动不应让整次上传作废
        var attempt = 0;
        function send() {
          attempt++;
          return readBase64(f.slice(start, end)).then(function (b64) {
            return post({ action: "part", uploadId: uploadId, index: i, dataBase64: b64 });
          }).then(function (res) {
            if (!res || !res.ok || !res.fileID) throw new Error((res && res.error) || "分片上传失败");
            parts[i] = res.fileID;
            sent += (end - start);
            setBar(Math.round((sent / f.size) * 90));
            return step(i + 1);
          }).catch(function (err) {
            if (attempt < 2) return send();
            throw err;
          });
        }
        return send();
      }

      function commit() {
        setStatus("上传完成，正在登记…");
        setBar(95);
        return post({ action: "commit", uploadId: uploadId, name: f.name, size: f.size, parts: parts });
      }

      step(0).then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || "登记失败");
        setBar(100);
        setStatus("上传成功，正在返回小程序…");
        backToMiniApp(uploadId, f.name, f.size);
      }).catch(function (err) {
        reset();
        setBar(null);
        setStatus("上传失败：" + ((err && err.message) || err), true);
      });
    }
  </script>
</body>
</html>
